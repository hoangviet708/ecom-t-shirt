<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Bootstrap 4 — Multiple Frames Layout</title>

    <!-- Bootstrap 4 CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">

    <style>
      /* body { background: #f8f9fa; padding: 2rem 0; } */
      .frame-box { background: #fff; border-radius: 1rem; box-shadow: 0 8px 24px rgba(0,0,0,0.08); padding: 1rem 1.5rem; margin-bottom: 2rem; }
      .card { border: 0; border-radius: 0.75rem; box-shadow: 0 4px 12px rgba(33,33,33,0.05); height: 100%; background-color: aquamarine; }

      .second-row-item { flex: 0 0 25%; max-width: 25%; margin-left: 1rem; }
      .second-row-wrapper { justify-content: flex-start !important; }
    </style>
  </head>
  <body>

    <div class="container">
      <header class="demo-header text-center">
        <h1 class="h3">Bootstrap 4 — Frames Example</h1>
        <p class="text-muted">Top frame with 4 columns and below a row with 2 frames, each containing one item at 25% width, aligned to the left.</p>
      </header>

      <!-- Frame 1: 4 columns -->
      <div class="frame-box">
        <div class="row">
          <div class="col-12 col-sm-6 col-md-6 col-lg-3">
            <div class="card p-3 h-100">
              <!-- <div class="card-body"> -->
                <!-- <h5 class="card-title">Column 1</h5>
                <p class="card-text small text-muted">First column inside the frame.</p>
                <a href="#" class="btn btn-primary btn-block mt-auto">Action</a>
              </div> -->
            </div>
          </div>

          <div class="col-12 col-sm-6 col-md-6 col-lg-3">
            <div class="card p-3 h-100">
              <!-- <div class="card-body"> -->
                <!-- <h5 class="card-title">Column 2</h5>
                <p class="card-text small text-muted">Second column content goes here.</p>
                <a href="#" class="btn btn-outline-primary btn-block mt-auto">Secondary</a>
              </div> -->
            </div>
          </div>

          <div class="col-12 col-sm-6 col-md-6 col-lg-3">
            <div class="card p-3 h-100">
              <!-- <div class="card-body"> -->
                <!-- <h5 class="card-title">Column 3</h5>
                <p class="card-text small text-muted">Third column inside this container.</p>
                <a href="#" class="btn btn-success btn-block mt-auto">Success</a>
              </div> -->
            </div>
          </div>

          <div class="col-12 col-sm-6 col-md-6 col-lg-3">
            <div class="card p-3 h-100">
              <!-- <div class="card-body"> -->
                <!-- <h5 class="card-title">Column 4</h5>
                <p class="card-text small text-muted">Last column, completing the set of four.</p>
                <a href="#" class="btn btn-danger btn-block mt-auto">Danger</a>
              </div> -->
            </div>
          </div>
        </div>
      </div>

      <!-- Row containing 2 frames, each with item 25% width -->
      <div class="row second-row-wrapper">
        <!-- Frame 2 -->
        <div class="frame-box d-flex justify-content-center align-items-center second-row-item mr-3">
          <div class="card p-3 w-100">
            <!-- <div class="card-body"> -->
              <!-- <h5 class="card-title">Left Frame Item</h5>
              <p class="card-text small text-muted">Single item inside left frame, 25% width.</p>
              <a href="#" class="btn btn-info btn-block mt-auto">Info</a>
            </div> -->
          </div>
        </div>

        <!-- Frame 3 -->
        <div class="frame-box d-flex justify-content-center align-items-center second-row-item">
          <div class="card p-3 w-100">
            <!-- <div class="card-body"> -->
              <!-- <h5 class="card-title">Right Frame Item</h5>
              <p class="card-text small text-muted">Single item inside right frame, 25% width.</p>
              <a href="#" class="btn btn-warning btn-block mt-auto">Warning</a>
            </div> -->
          </div>
        </div>
      </div>

      <footer class="mt-5 text-center text-muted small">
        Layout adjusted: second row items now shifted to the left.
      </footer>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
  </body>
</html>
